name: Site problem
description: Something on oregonwine.app doesn't work or looks wrong
title: "Problem: "
labels: [site]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: The page's address, or what you had open (graph, map, list, a record).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari; or Windows laptop, Chrome
  - type: input
    id: version
    attributes:
      label: Site version
      description: Shown under the filters, and in About.
